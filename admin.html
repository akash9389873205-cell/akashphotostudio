<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Dashboard | Akash Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen flex">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="w-full h-full flex flex-col items-center justify-center bg-gray-950 absolute inset-0 z-50">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
            <div class="w-16 h-16 bg-amber-600/20 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Admin Access</h2>
            <p class="text-gray-400 text-sm mb-8">Restricted to authorized personnel only.</p>
            
            <button id="googleLoginBtn" class="w-full py-3.5 bg-white text-gray-900 font-bold rounded-lg hover:bg-gray-200 transition-all flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            <p id="loginError" class="text-red-400 text-sm mt-4 hidden p-3 bg-red-900/20 border border-red-900/50 rounded-lg"></p>
        </div>
    </div>

    <!-- ADMIN DASHBOARD (Hidden until authorized) -->
    <div id="adminDashboard" class="w-full h-full hidden flex-col md:flex-row">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-gray-900 border-r border-gray-800 p-6 flex flex-col">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-8 h-8 bg-amber-600 rounded flex items-center justify-center">
                    <i data-lucide="camera" class="w-4 h-4 text-white"></i>
                </div>
                <h1 class="text-xl font-bold">Akash Admin</h1>
            </div>
            
            <nav class="space-y-2 flex-grow">
                <button onclick="switchTab('messagesTab')" class="w-full text-left px-4 py-3 rounded-lg bg-gray-800 text-amber-500 font-medium flex items-center gap-3">
                    <i data-lucide="mail" class="w-4 h-4"></i> Client Messages
                </button>
                <button onclick="switchTab('servicesTab')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition-colors flex items-center gap-3">
                    <i data-lucide="layout-list" class="w-4 h-4"></i> Services
                </button>
                <button onclick="switchTab('photosTab')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition-colors flex items-center gap-3">
                    <i data-lucide="image" class="w-4 h-4"></i> Photos
                </button>
            </nav>
            
            <div class="mt-auto border-t border-gray-800 pt-4">
                <p class="text-xs text-gray-500 mb-3 truncate">singhtechie0001@gmail.com</p>
                <button id="logoutBtn" class="w-full px-4 py-2 bg-red-900/50 text-red-400 hover:bg-red-900 hover:text-red-300 rounded transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-8 overflow-y-auto bg-gray-950">
            
            <!-- 1. Client Messages Tab -->
            <div id="messagesTab" class="tab-content">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="inbox" class="text-amber-500"></i> Client Inquiries
                </h2>
                <div id="messagesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-gray-500">Loading messages...</p>
                </div>
            </div>

            <!-- 2. Manage Services Tab -->
            <div id="servicesTab" class="tab-content hidden">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="text-amber-500"></i> Add New Service
                </h2>
                <form id="addServiceForm" class="bg-gray-900 border border-gray-800 p-6 rounded-xl shadow-md space-y-4 max-w-2xl">
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold mb-1 block">Service Type</label>
                        <select id="serviceTitle" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg focus:border-amber-500 outline-none text-white" required>
                            <option value="" disabled selected>Select a Service Type...</option>
                            <option value="Engagement">Engagement</option>
                            <option value="Pre-Wedding">Pre-Wedding</option>
                            <option value="Wedding">Wedding</option>
                            <option value="Baby Shower">Baby Shower</option>
                            <option value="Maternity">Maternity</option>
                            <option value="Fashion Photography">Fashion Photography</option>
                            <option value="Travel Photography">Travel Photography</option>
                            <option value="Personal Portrait">Personal Portrait</option>
                            <option value="Family Photography">Family Photography</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold mb-1 block">Description</label>
                        <textarea id="serviceDesc" placeholder="Service Details" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg focus:border-amber-500 outline-none text-white" rows="3" required></textarea>
                    </div>
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold mb-1 block">Features (Comma Separated)</label>
                        <input type="text" id="serviceBullets" placeholder="Candid, Drone, Video" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg focus:border-amber-500 outline-none text-white">
                    </div>
                    <button type="submit" class="px-6 py-3 bg-amber-600 text-white rounded-lg font-bold hover:bg-amber-700 w-full mt-4">Save Service to Database</button>
                </form>
            </div>

            <!-- 3. Manage Photos Tab -->
            <div id="photosTab" class="tab-content hidden">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="link" class="text-amber-500"></i> Add Portfolio Photo Link
                </h2>
                <form id="addPhotoForm" class="bg-gray-900 border border-gray-800 p-6 rounded-xl shadow-md space-y-4 max-w-2xl">
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold mb-1 block">Photo Title</label>
                        <input type="text" id="photoTitle" placeholder="e.g. Sunset Wedding" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg focus:border-amber-500 outline-none text-white" required>
                    </div>
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold mb-1 block">Category</label>
                        <select id="photoCategory" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg focus:border-amber-500 outline-none text-white" required>
                            <option value="" disabled selected>Select Category...</option>
                            <option value="Engagement">Engagement</option>
                            <option value="Pre-Wedding">Pre-Wedding</option>
                            <option value="Wedding">Wedding</option>
                            <option value="Baby Shower">Baby Shower</option>
                            <option value="Maternity">Maternity</option>
                            <option value="Fashion Photography">Fashion Photography</option>
                            <option value="Travel Photography">Travel Photography</option>
                            <option value="Personal Portrait">Personal Portrait</option>
                            <option value="Family Photography">Family Photography</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs uppercase text-gray-500 font-bold mb-1 block">Image URL (ImgBB / External Link)</label>
                        <input type="url" id="photoUrl" placeholder="https://i.ibb.co/example.jpg" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg focus:border-amber-500 outline-none text-white" required>
                    </div>
                    <button type="submit" class="px-6 py-3 bg-amber-600 text-white rounded-lg font-bold hover:bg-amber-700 w-full mt-4">Save Photo Link</button>
                </form>
            </div>

        </main>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, updateDoc, deleteDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAE1UfdqWZUZfi3PpRVscNYnQNeHjMOYTM",
            authDomain: "akashphotostudio-cb1db.firebaseapp.com",
            projectId: "akashphotostudio-cb1db",
            storageBucket: "akashphotostudio-cb1db.firebasestorage.app",
            messagingSenderId: "977730665800",
            appId: "1:977730665800:web:b9279e58cc4e08ff8b077d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        // Security Configuration: The ONLY allowed email
        const ALLOWED_EMAIL = "singhtechie0001@gmail.com";

        // UI Elements
        const loginScreen = document.getElementById('loginScreen');
        const adminDashboard = document.getElementById('adminDashboard');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');

        // Initialize Icons
        lucide.createIcons();

        // 1. Authentication Listener (Handles strict email checking)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is logged in via Google. Now verify if it is the correct email.
                if (user.email === ALLOWED_EMAIL) {
                    // Access Granted
                    loginScreen.classList.add('hidden');
                    adminDashboard.classList.remove('hidden');
                    adminDashboard.classList.add('flex');
                    loginError.classList.add('hidden');

                    // Load real-time messages since we are authorized
                    loadMessages();
                } else {
                    // Access Denied - Immediately sign them out
                    signOut(auth).then(() => {
                        loginError.innerHTML = `Access Denied.<br><b>${user.email}</b> is not authorized.`;
                        loginError.classList.remove('hidden');
                    });
                }
            } else {
                // User is fully signed out
                loginScreen.classList.remove('hidden');
                adminDashboard.classList.add('hidden');
                adminDashboard.classList.remove('flex');
            }
        });

        // 2. Load Messages in Real-time
        function loadMessages() {
            const messagesContainer = document.getElementById('messagesContainer');
            const q = query(collection(db, "messages"), orderBy("date", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    messagesContainer.innerHTML = '<div class="col-span-full p-8 text-center text-gray-500 bg-gray-900 border border-gray-800 rounded-xl">No messages received yet.</div>';
                    return;
                }

                let html = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const dateObj = new Date(msg.date);
                    const formattedDate = dateObj.toLocaleDateString() + ' at ' + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const isNew = !msg.isRead;

                    html += `
                    <div class="bg-gray-900 border ${isNew ? 'border-amber-500/50' : 'border-gray-800'} p-6 rounded-xl shadow-lg relative flex flex-col h-full">
                        ${isNew ? '<span class="absolute top-4 right-4 bg-amber-500 text-white text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider">New</span>' : ''}
                        
                        <div class="mb-4">
                            <span class="inline-block px-3 py-1 bg-gray-950 border border-gray-800 text-amber-500 text-xs font-bold rounded-full mb-3">${msg.service || 'General Inquiry'}</span>
                            <h3 class="text-xl font-bold text-white">${msg.firstName} ${msg.lastName}</h3>
                            <a href="mailto:${msg.email}" class="text-sm text-gray-400 hover:text-amber-500 transition-colors flex items-center gap-1 mt-1">
                                <i data-lucide="mail" class="w-3 h-3"></i> ${msg.email}
                            </a>
                        </div>
                        
                        <div class="flex-grow">
                            <p class="text-gray-300 text-sm bg-gray-950 p-4 rounded-lg border border-gray-800 break-words">${msg.message}</p>
                        </div>
                        
                        <div class="mt-4 pt-4 border-t border-gray-800 flex justify-between items-center">
                            <p class="text-xs text-gray-500"><i data-lucide="clock" class="w-3 h-3 inline pb-0.5"></i> ${formattedDate}</p>
                            <div class="flex gap-3">
                                ${isNew ? `<button onclick="markAsRead('${docSnap.id}')" class="text-xs font-bold text-amber-500 hover:text-amber-400 flex items-center gap-1 transition-colors"><i data-lucide="check-circle" class="w-4 h-4"></i> Read</button>` : ''}
                                <button onclick="deleteMessage('${docSnap.id}')" class="text-xs font-bold text-red-500 hover:text-red-400 flex items-center gap-1 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete</button>
                            </div>
                        </div>
                    </div>`;
                });
                messagesContainer.innerHTML = html;
                lucide.createIcons(); // Re-render icons for new content
            });
        }

        // Global functions for inline HTML buttons
        window.markAsRead = async (id) => {
            try {
                await updateDoc(doc(db, "messages", id), { isRead: true });
            } catch (error) {
                console.error("Error updating message:", error);
            }
        };

        window.deleteMessage = async (id) => {
            if (confirm("Are you sure you want to delete this message?")) {
                try {
                    await deleteDoc(doc(db, "messages", id));
                } catch (error) {
                    console.error("Error deleting message:", error);
                }
            }
        };

        // --- NEW: Add Service Logic ---
        document.getElementById('addServiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'Saving... <i data-lucide="loader-2" class="w-4 h-4 animate-spin inline"></i>';
            submitBtn.disabled = true;
            lucide.createIcons();

            const newService = {
                title: document.getElementById('serviceTitle').value,
                description: document.getElementById('serviceDesc').value,
                bullets: document.getElementById('serviceBullets').value,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "services"), newService);
                alert("Service added successfully! It is now live on the website.");
                e.target.reset();
            } catch (error) {
                console.error("Error adding service:", error);
                alert("Failed to add service. Check console for details.");
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                lucide.createIcons();
            }
        });

        // --- NEW: External Link Photo Logic ---
        document.getElementById('addPhotoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'Saving... <i data-lucide="loader-2" class="w-4 h-4 animate-spin inline"></i>';
            submitBtn.disabled = true;
            lucide.createIcons();

            const title = document.getElementById('photoTitle').value;
            const category = document.getElementById('photoCategory').value;
            const imageUrl = document.getElementById('photoUrl').value;

            try {
                // Save the Photo details & External URL to Firestore database
                await addDoc(collection(db, "photos"), {
                    title: title,
                    category: category,
                    imageUrl: imageUrl, // Saving the external link directly
                    createdAt: new Date().toISOString()
                });

                alert("Photo link saved successfully! It is now live in your portfolio.");
                e.target.reset();
            } catch (error) {
                console.error("Error saving photo link:", error);
                alert("Failed to save link.");
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                lucide.createIcons();
            }
        });

        // 3. Google Login Click Event
        googleLoginBtn.addEventListener('click', () => {
            loginError.classList.add('hidden');
            googleLoginBtn.innerHTML = "Opening Google...";
            
            signInWithPopup(auth, provider)
                .then(() => {
                    googleLoginBtn.innerHTML = "Verifying access...";
                })
                .catch((error) => {
                    console.error("Login Error:", error);
                    loginError.textContent = "Sign-in failed or was cancelled.";
                    loginError.classList.remove('hidden');
                    // Reset button
                    googleLoginBtn.innerHTML = `
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg> Sign in with Google`;
                });
        });

        // 4. Logout Logic
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                // Reset button text
                googleLoginBtn.innerHTML = `
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg> Sign in with Google`;
            }).catch((error) => console.error("Logout Error:", error));
        });

        // 5. Tab Switching Logic
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            // Update sidebar active states
            const buttons = document.querySelectorAll('aside nav button');
            buttons.forEach(btn => {
                btn.classList.remove('bg-gray-800', 'text-amber-500');
                btn.classList.add('text-gray-400');
            });
            
            const activeBtn = Array.from(buttons).find(btn => btn.getAttribute('onclick').includes(tabId));
            if(activeBtn) {
                activeBtn.classList.add('bg-gray-800', 'text-amber-500');
                activeBtn.classList.remove('text-gray-400');
            }
        };
    </script>
</body>
</html>
