<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Akash Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex">

    <!-- LOGIN SCREEN (Visible by default until authenticated) -->
    <div id="loginScreen" class="w-full h-full flex flex-col items-center justify-center bg-slate-900 absolute inset-0 z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-6 text-blue-600">Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-500 mb-1">Email</label>
                    <input type="email" id="adminEmail" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-500 mb-1">Password</label>
                    <input type="password" id="adminPassword" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-all">Login</button>
                <p id="loginError" class="text-red-500 text-sm text-center hidden">Invalid credentials. Please try again.</p>
            </form>
        </div>
    </div>

    <!-- ADMIN DASHBOARD (Hidden until logged in) -->
    <div id="adminDashboard" class="w-full h-full hidden flex-col md:flex-row">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col">
            <h1 class="text-2xl font-bold mb-8">Akash Admin</h1>
            <nav class="space-y-4 flex-grow">
                <button onclick="switchTab('servicesTab')" class="w-full text-left px-4 py-2 rounded bg-blue-600 hover:bg-blue-700">Manage Services</button>
                <button onclick="switchTab('photosTab')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800">Manage Photos</button>
            </nav>
            <button id="logoutBtn" class="mt-auto px-4 py-2 bg-red-500 rounded hover:bg-red-600">Logout</button>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-8 overflow-y-auto">
            
            <!-- Manage Services Tab -->
            <div id="servicesTab" class="tab-content">
                <h2 class="text-3xl font-bold mb-6">Add New Service</h2>
                <form id="addServiceForm" class="bg-white p-6 rounded-xl shadow-md space-y-4 max-w-2xl">
                    <input type="text" id="serviceTitle" placeholder="Service Title (e.g. Wedding Shoots)" class="w-full px-4 py-2 border rounded" required>
                    <textarea id="serviceDesc" placeholder="Service Description" class="w-full px-4 py-2 border rounded" rows="3" required></textarea>
                    <input type="text" id="serviceBullets" placeholder="Features (comma separated: Candid, Drone, Video)" class="w-full px-4 py-2 border rounded">
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Save Service</button>
                </form>
            </div>

            <!-- Manage Photos Tab (Hidden by default) -->
            <div id="photosTab" class="tab-content hidden">
                <h2 class="text-3xl font-bold mb-6">Upload Portfolio Photo</h2>
                <form id="addPhotoForm" class="bg-white p-6 rounded-xl shadow-md space-y-4 max-w-2xl">
                    <input type="text" id="photoTitle" placeholder="Photo Title" class="w-full px-4 py-2 border rounded" required>
                    <input type="text" id="photoCategory" placeholder="Category (e.g. Wedding, Fashion)" class="w-full px-4 py-2 border rounded" required>
                    <!-- File input for image upload -->
                    <input type="file" id="photoFile" accept="image/*" class="w-full px-4 py-2 border rounded" required>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Upload Photo</button>
                </form>
            </div>

        </main>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAE1UfdqWZUZfi3PpRVscNYnQNeHjMOYTM",
            authDomain: "akashphotostudio-cb1db.firebaseapp.com",
            projectId: "akashphotostudio-cb1db",
            storageBucket: "akashphotostudio-cb1db.firebasestorage.app",
            messagingSenderId: "977730665800",
            appId: "1:977730665800:web:b9279e58cc4e08ff8b077d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // UI Elements
        const loginScreen = document.getElementById('loginScreen');
        const adminDashboard = document.getElementById('adminDashboard');
        const loginForm = document.getElementById('loginForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');

        // 1. Authentication Listener (Checks if you are logged in)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in, show dashboard
                loginScreen.classList.add('hidden');
                adminDashboard.classList.remove('hidden');
                adminDashboard.classList.add('flex');
            } else {
                // User is signed out, show login
                loginScreen.classList.remove('hidden');
                adminDashboard.classList.add('hidden');
                adminDashboard.classList.remove('flex');
            }
        });

        // 2. Login Logic
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    loginForm.reset();
                    loginError.classList.add('hidden');
                })
                .catch((error) => {
                    console.error("Login Error:", error.message);
                    loginError.classList.remove('hidden');
                });
        });

        // 3. Logout Logic
        logoutBtn.addEventListener('click', () => {
            signOut(auth).catch((error) => console.error("Logout Error:", error));
        });

        // 4. Simple Tab Switching Logic (Exposed to global window for HTML onClick)
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        };
    </script>
</body>
</html>
